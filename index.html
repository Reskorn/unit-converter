<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit converter · EngLab</title>
  <meta name="description" content="Convert length, mass, pressure, energy and temperature, with a saved history of your conversions.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B3E8A'/%3E%3Cpath d='M16 26h28l-7-7M48 38H20l7 7' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    try {
      var savedTheme = localStorage.getItem('unitconv.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (error) {
      /* Storage may be blocked; CSS will use the operating system preference. */
    }
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="el-paper">
  <header class="el-topbar">
    <div class="el-wrap">
      <div class="el-topbar__left">
        <a class="el-logo" href="./" aria-label="EngLab unit converter home">
          <span class="el-logo__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>
          </span>
          <span>EngLab</span>
        </a>
      </div>
      <div class="el-topbar__right">
        <button id="theme-toggle" class="el-iconbtn" type="button" aria-label="Switch to dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="app" class="el-wrap"></main>
  <div id="live" class="el-sr" aria-live="polite" aria-atomic="true"></div>
  <noscript>This unit converter needs JavaScript enabled.</noscript>
  <script src="app.js"></script>
</body>
</html>
